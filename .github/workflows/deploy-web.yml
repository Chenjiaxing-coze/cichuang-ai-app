name: Deploy Web (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: pages-deploy-web
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Tailwind CSS
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Deploy to Cloudflare Pages
        # 仅在仓库已配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 时部署；
        # 未配置则跳过此步（构建步骤仍会校验 CSS 可正常生成）。
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web --project-name cichuang-ai-web --commit-dirty=true
