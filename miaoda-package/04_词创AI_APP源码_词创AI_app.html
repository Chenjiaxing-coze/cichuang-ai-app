<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}

/* ===== 主题变量 ===== */
:root{
  --bg-0:#0A0E1A;--bg-1:#111827;--bg-2:#1A2233;--bg-3:#222B3D;
  --text-primary:#E5E7EB;--text-secondary:#94A3B8;--text-muted:#64748B;
  --border-color:rgba(255,255,255,.08);--glass-bg:rgba(255,255,255,.04);--glass-strong-bg:rgba(17,24,39,.65);
  --code-bg:#0B1D2D;
}
html.light{
  --bg-0:#F8FAFC;--bg-1:#FFFFFF;--bg-2:#F1F5F9;--bg-3:#E2E8F0;
  --text-primary:#0F172A;--text-secondary:#475569;--text-muted:#94A3B8;
  --border-color:rgba(0,0,0,.08);--glass-bg:rgba(255,255,255,.7);--glass-strong-bg:rgba(255,255,255,.85);
  --code-bg:#F8FAFC;
}
body{
  font-family:var(--font-sans);
  background:var(--bg-0);color:var(--text-primary);min-height:100vh;
  overflow-x:hidden;transition:background .3s,color .3s;
}
html.light body{background:#F8FAFC;}

/* 背景渐变 */
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(1200px 600px at 10% -10%,rgba(47,102,176,.25),transparent 60%),
    radial-gradient(900px 500px at 100% 0%,rgba(168,85,247,.18),transparent 60%),
    radial-gradient(800px 400px at 50% 100%,rgba(34,211,238,.15),transparent 60%),
    var(--bg-0);
  transition:background .3s;
}
html.light body::before{
  background:
    radial-gradient(1200px 600px at 10% -10%,rgba(47,102,176,.10),transparent 60%),
    radial-gradient(900px 500px at 100% 0%,rgba(168,85,247,.08),transparent 60%),
    radial-gradient(800px 400px at 50% 100%,rgba(34,211,238,.08),transparent 60%),
    #F8FAFC;
}
canvas#particles{position:fixed;inset:0;z-index:-1;pointer-events:none}

/* 玻璃卡片 */
.glass{background:var(--glass-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border-color);border-radius:14px;transition:background .3s,border-color .3s}
.glass-strong{background:var(--glass-strong-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border-color);border-radius:14px;transition:background .3s,border-color .3s}

/* 文字渐变 */
.text-gradient{background:linear-gradient(90deg,#22D3EE 0%,#2F66B0 50%,#A855F7 100%);-webkit-background-clip:text;background-clip:text;color:transparent}

/* 卡片hover */
.card-hover{position:relative;transition:transform .25s ease-out,box-shadow .25s ease-out,border-color .25s;cursor:pointer}
.card-hover:hover{transform:translateY(-4px);box-shadow:0 16px 40px -12px rgba(0,0,0,.4),0 0 0 1px rgba(34,211,238,.25)}
.card-hover::after{
  content:"";position:absolute;top:0;left:0;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(34,211,238,.12),transparent);
  transform:translateX(-200%);transition:transform .5s ease-out;
  border-radius:inherit;pointer-events:none;
}
.card-hover:hover::after{transform:translateX(350%)}

/* 淡入 */
.fade-in{animation:fadeInUp .3s ease-out both}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* 涟漪 */
.ripple{position:relative;overflow:hidden}
.ripple .rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.3);transform:scale(0);animation:ripple .6s ease-out;pointer-events:none}
@keyframes ripple{to{transform:scale(4);opacity:0}}

/* Toast */
.toast{position:fixed;left:50%;bottom:80px;transform:translate(-50%,20px);opacity:0;z-index:100;transition:all .3s ease-out;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.device-mobile .toast{bottom:calc(90px + env(safe-area-inset-bottom))}

/* 滚动条 */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,.25);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(128,128,128,.4)}
::-webkit-scrollbar-track{background:transparent}

/* 代码预览区 */
.preview-code{
  background:var(--code-bg);color:var(--text-primary);font-family:'SF Mono','Menlo',ui-monospace,monospace;
  font-size:13.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word;
  border-radius:12px;border:1px solid var(--border-color);
  padding:20px;max-height:70vh;overflow-y:auto;transition:background .3s,color .3s;
}
.preview-code h1{color:#22D3EE;font-size:18px;font-weight:700;margin:1em 0 .5em;padding-bottom:.3em;border-bottom:1px solid rgba(34,211,238,.25)}
.preview-code h2{color:#60A5FA;font-size:15px;font-weight:700;margin:1em 0 .4em;padding-left:8px;border-left:3px solid #2F66B0}
.preview-code h3{color:#A78BFA;font-size:14px;font-weight:600;margin:.8em 0 .3em}
.preview-code blockquote{border-left:3px solid #A855F7;background:rgba(168,85,247,.08);padding:.6em 1em;margin:.6em 0;border-radius:0 8px 8px 0;color:#C4B5FD;font-size:13px}
.preview-code strong{color:#22D3EE;font-weight:600}
.preview-code code{background:rgba(255,255,255,.06);padding:1px 6px;border-radius:4px;color:#FCA5A5;font-size:12.5px}
.preview-code ul,.preview-code ol{padding-left:1.6em;margin:.4em 0}
.preview-code li{margin:.2em 0}
.preview-code hr{border:none;border-top:1px dashed var(--border-color);margin:1em 0}
html.light .preview-code h1{color:#0EA5E9}
html.light .preview-code strong{color:#0284C7}
html.light .preview-code code{background:rgba(0,0,0,.05);color:#DC2626}

.cat-icon{font-size:32px;line-height:1}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;background:rgba(47,102,176,.18);color:#60A5FA;border:1px solid rgba(47,102,176,.35);margin:0 4px 4px 0;white-space:nowrap}
.tag-cyan{background:rgba(34,211,238,.12);color:#22D3EE;border-color:rgba(34,211,238,.3)}
.tag-purple{background:rgba(168,85,247,.12);color:#C4B5FD;border-color:rgba(168,85,247,.3)}
.tag-green{background:rgba(16,185,129,.12);color:#10B981;border-color:rgba(16,185,129,.3)}
html.light .tag{background:rgba(47,102,176,.1);color:#1E40AF}
html.light .tag-cyan{background:rgba(14,165,233,.1);color:#0369A1}
html.light .tag-purple{background:rgba(147,51,234,.1);color:#7E22CE}

.btn-primary{background:linear-gradient(135deg,#2F66B0,#22D3EE);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px;transition:all .25s;border:none;cursor:pointer;box-shadow:0 6px 20px -6px rgba(47,102,176,.6)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 28px -8px rgba(34,211,238,.6)}
.btn-ghost{background:var(--glass-bg);color:var(--text-primary);padding:9px 16px;border-radius:10px;border:1px solid var(--border-color);font-size:14px;cursor:pointer;transition:all .2s}
.btn-ghost:hover{background:rgba(34,211,238,.08);border-color:rgba(34,211,238,.4);color:var(--text-primary)}
.btn-ai{display:flex;align-items:center;gap:10px;padding:14px 18px;border-radius:12px;background:var(--glass-bg);border:1px solid var(--border-color);transition:all .25s;cursor:pointer;color:var(--text-primary)}
.btn-ai:hover{border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.06);transform:translateY(-2px)}
.input{width:100%;background:var(--glass-bg);border:1px solid var(--border-color);border-radius:10px;padding:10px 14px;color:var(--text-primary);font-size:14px;transition:all .2s;outline:none}
.input:focus{border-color:#22D3EE;box-shadow:0 0 0 3px rgba(34,211,238,.15);background:var(--glass-strong-bg)}
textarea.input{resize:vertical;min-height:180px;line-height:1.7;font-family:inherit}
html.light .input::placeholder{color:#94A3B8}

/* 移动端底部Tab Bar */
.mobile-tabbar{display:none}
.device-mobile .mobile-tabbar{
  display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:var(--glass-strong-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border-color);
  height:calc(56px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
}
.device-mobile .tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-muted);font-size:10px;gap:3px;cursor:pointer;padding-top:6px}
.device-mobile .tab-item.active{color:#22D3EE}
.device-mobile .tab-item svg{width:22px;height:22px}
.device-mobile main#app{padding-bottom:calc(80px + env(safe-area-inset-bottom))!important}

.device-mobile .pc-only{display:none!important}
.device-pc .mobile-only{display:none!important}

/* 抽屉 */
.drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;opacity:0;pointer-events:none;transition:opacity .25s}
.drawer-mask.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:78%;max-width:320px;background:var(--bg-1);z-index:71;transform:translateX(-100%);transition:transform .3s ease-out;border-right:1px solid var(--border-color);padding:20px;padding-top:calc(20px + env(safe-area-inset-top));overflow-y:auto}
.drawer.show{transform:translateX(0)}

/* FAB */
.fab{position:fixed;right:20px;bottom:80px;z-index:50;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#A855F7,#22D3EE);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px -6px rgba(168,85,247,.6);cursor:pointer;transition:transform .2s;border:none}
.fab:hover{transform:scale(1.08)}
.device-mobile .fab{bottom:calc(80px + env(safe-area-inset-bottom));right:16px}

/* Modal */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.modal-mask.show{display:flex}
.modal{background:var(--bg-1);border:1px solid var(--border-color);border-radius:16px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.device-mobile .modal{max-width:100%;border-radius:16px 16px 0 0;position:fixed;bottom:0;left:0;right:0;max-height:85vh;transform:translateY(100%);transition:transform .3s ease-out}
.device-mobile .modal-mask.show{align-items:flex-end}
.device-mobile .modal.show{transform:translateY(0)}

.wx-tip{background:linear-gradient(90deg,rgba(245,158,11,.15),rgba(245,158,11,.05));border:1px solid rgba(245,158,11,.3);color:#FCD34D;padding:10px 16px;font-size:12px;display:none;position:relative}
.platform-wechat .wx-tip{display:flex;align-items:center;gap:8px}
.wx-tip .close{position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:#FCD34D;opacity:.7}

.logo-pulse{position:relative}
.logo-pulse::after{content:"";position:absolute;inset:-4px;border-radius:inherit;border:2px solid #22D3EE;animation:pulseRing 2s ease-out infinite;opacity:0}

.step-num{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#22D3EE,#A855F7);color:#fff;font-weight:700;font-size:13px;flex-shrink:0}
.warn-orange{color:#F59E0B!important}

@media (min-width:1024px){
  .prompt-layout{display:grid;grid-template-columns:45% 55%;gap:20px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
.ai-portal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.ai-portal{grid-template-columns:repeat(4,1fr)}}
.seg-tab{padding:10px 16px;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;font-size:14px;transition:all .2s;white-space:nowrap}
.seg-tab.active{color:#22D3EE;border-color:#22D3EE}
.like-burst{animation:burst .5s ease-out}
@keyframes burst{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
.count-num{font-variant-numeric:tabular-nums}
.device-mobile .copy-bar{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));padding:10px 16px;background:var(--glass-strong-bg);backdrop-filter:blur(16px);border-top:1px solid var(--border-color);z-index:40}
.safe-top{padding-top:env(safe-area-inset-top)}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom)}
button:focus-visible,a:focus-visible{outline:2px solid #22D3EE;outline-offset:2px}

/* 统计卡片 */
.stat-card{text-align:center;padding:16px;border-radius:12px;background:var(--glass-bg);border:1px solid var(--border-color)}
/* 进度条 */
.progress-bar{height:6px;background:var(--bg-2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#22D3EE,#A855F7);border-radius:3px;transition:width .5s ease}
/* 安装提示 */
.install-banner{background:linear-gradient(135deg,rgba(34,211,238,.1),rgba(168,85,247,.1));border:1px solid rgba(34,211,238,.3);border-radius:12px;padding:14px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
/* 切换按钮 */
.theme-toggle{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--glass-bg);border:1px solid var(--border-color);cursor:pointer;color:var(--text-secondary);transition:all .2s}
.theme-toggle:hover{background:rgba(34,211,238,.08);border-color:rgba(34,211,238,.4);color:#22D3EE}
/* 空状态 */
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted)}
</style>
</head>

function $(s,root=document){return root.querySelector(s)}
function $$(s,root=document){return Array.from(root.querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function debounce(fn,wait){let t;return function(...a){clearTimeout(t);t=setTimeout(()=>fn.apply(this,a),wait)}}
function throttle(fn,wait){let last=0;return function(...a){const n=Date.now();if(n-last>=wait){last=n;fn.apply(this,a)}}}
function toast(msg,type='info'){
  const t=$('#toast');
  const colors={info:'bg-bg-1 border-white/10',success:'bg-neon-green/20 border-neon-green/40',warn:'bg-neon-amber/20 border-neon-amber/40',error:'bg-neon-red/20 border-neon-red/40'};
  const icons={info:'ℹ️',success:'✅',warn:'⚠️',error:'❌'};
  t.className=`toast px-5 py-3 rounded-xl shadow-2xl text-sm font-medium border ${colors[type]||colors.info}`;
  t.innerHTML=`<span class="mr-2">${icons[type]||icons.info}</span>${esc(msg)}`;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);return true;
  }catch{
    const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');document.body.removeChild(ta);return true}
    catch{document.body.removeChild(ta);return false}
  }
}
function downloadFile(filename, content, type='text/markdown'){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ─── Markdown 渲染 ─── */
function mdRender(text){
  if(!text)return '';
  let s=esc(text);
  s=s.replace(/```([\s\S]*?)```/g,(_,c)=>'<pre style="background:var(--bg-2);padding:10px;border-radius:8px;overflow-x:auto;font-family:monospace;font-size:12.5px;border:1px solid var(--border-color);margin:.6em 0"><code>'+c+'</code></pre>');
  s=s.replace(/`([^`]+)`/g,'<code style="background:rgba(255,255,255,.06);padding:1px 6px;border-radius:4px;color:#FCA5A5;font-size:12.5px">$1</code>');
  s=s.replace(/^### (.+)$/gm,'<h3 style="color:#A78BFA;font-size:15px;font-weight:600;margin:.8em 0 .3em">$1</h3>');
  s=s.replace(/^## (.+)$/gm,'<h2 style="color:#60A5FA;font-size:16px;font-weight:700;margin:1em 0 .4em;padding-left:8px;border-left:3px solid #2F66B0">$1</h2>');
  s=s.replace(/^# (.+)$/gm,'<h1 style="color:#22D3EE;font-size:19px;font-weight:700;margin:1em 0 .5em;padding-bottom:.3em;border-bottom:1px solid rgba(34,211,238,.25)">$1</h1>');
  s=s.replace(/\*\*(.+?)\*\*/g,'<strong style="color:#22D3EE;font-weight:600">$1</strong>');
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:#22D3EE;text-decoration:underline">$1</a>');
  s=s.replace(/!\[([^\]]*)\]\((https?:\/\/[^\)]+)\)/g,'<img src="$2" alt="$1" loading="lazy" style="max-width:100%;border-radius:8px;margin:.6em 0"/>');
  s=s.replace(/^&gt; (.+)$/gm,'<blockquote style="border-left:3px solid #A855F7;background:rgba(168,85,247,.08);padding:.6em 1em;margin:.6em 0;border-radius:0 8px 8px 0;color:#C4B5FD;font-size:13px">$1</blockquote>');
  s=s.replace(/^---+$/gm,'<hr style="border:none;border-top:1px dashed var(--border-color);margin:1em 0"/>');
  s=s.replace(/^- (.+)$/gm,'<li style="margin:.2em 0">$1</li>');
  s=s.replace(/^(\d+)\. (.+)$/gm,'<li style="margin:.2em 0">$2</li>');
  s=s.split(/\n\n+/).map(p=>{
    if(p.startsWith('<h')||p.startsWith('<pre')||p.startsWith('<blockquote')||p.startsWith('<ul')||p.startsWith('<ol')||p.startsWith('<hr')||p.startsWith('<img'))return p;
    if(p.includes('<li>'))return '<ul style="padding-left:1.6em;margin:.4em 0">'+p+'</ul>';
    return '<p style="margin:.4em 0">'+p.replace(/\n/g,'<br>')+'</p>';
  }).join('');
  return s;
}

/* ═══════════ API 层 ═══════════ */
/* ════════════════════════════════════════════════════════════
   ★ 真实后端客户端（替换原 API 模拟层）
   - 所有请求走 apiRequest：JWT 双令牌 + HMAC 签名(防重放) + 401 自动刷新
   - 离线 / 后端不可达时：社区与提示词自动降级到本地缓存，不白屏不崩溃
   - 配置由原生壳注入 window.__APP_CONFIG__（API_BASE / SIGN_SECRET），浏览器默认同源
   ════════════════════════════════════════════════════════════ */
const API_BASE = (window.__APP_CONFIG__ && window.__APP_CONFIG__.API_BASE) || '';
const SIGN_SECRET = (window.__APP_CONFIG__ && window.__APP_CONFIG__.SIGN_SECRET) || 'wc_anon_secret_2026_dev';

/* —— 标准 SHA-256 / HMAC-SHA256（纯 JS，零依赖；已通过 NIST 向量 + Node 官方交叉验证）—— */
function _rotr(x,n){return (x>>>n)|(x<<(32-n))}
function _sha256bin(bytes){
  const K=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
  let H=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  const ml=bytes.length*8, withOne=bytes.length+1, total=((withOne+8+63)&~63);
  const padded=new Uint8Array(total); padded.set(bytes); padded[bytes.length]=0x80;
  const dv=new DataView(padded.buffer); dv.setUint32(total-4,ml>>>0); dv.setUint32(total-8,Math.floor(ml/0x100000000));
  const w=new Uint32Array(64);
  for(let off=0;off<total;off+=64){
    for(let i=0;i<16;i++)w[i]=dv.getUint32(off+i*4);
    for(let i=16;i<64;i++){const s0=_rotr(w[i-15],7)^_rotr(w[i-15],18)^(w[i-15]>>>3);const s1=_rotr(w[i-2],17)^_rotr(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0;}
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let i=0;i<64;i++){const S1=_rotr(e,6)^_rotr(e,11)^_rotr(e,25);const ch=(e&f)^((~e)&g);const t1=(h+S1+ch+K[i]+w[i])>>>0;const S0=_rotr(a,2)^_rotr(a,13)^_rotr(a,22);const maj=(a&b)^(a&c)^(b&c);const t2=(S0+maj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;}
    H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
  }
  const out=new Uint8Array(32);
  for(let i=0;i<8;i++){out[i*4]=(H[i]>>>24)&255;out[i*4+1]=(H[i]>>>16)&255;out[i*4+2]=(H[i]>>>8)&255;out[i*4+3]=H[i]&255;}
  return out;
}
function _concat(a,b){const r=new Uint8Array(a.length+b.length);r.set(a);r.set(b,a.length);return r;}
function sha256(s){return Array.from(_sha256bin(new TextEncoder().encode(s))).map(x=>x.toString(16).padStart(2,'0')).join('');}
function hmacSha256(keyStr,msgStr){
  const enc=new TextEncoder();
  let key=enc.encode(keyStr); if(key.length>64)key=_sha256bin(key);
  const k=new Uint8Array(64); k.set(key);
  const ipad=new Uint8Array(64), opad=new Uint8Array(64);
  for(let i=0;i<64;i++){ipad[i]=k[i]^0x36; opad[i]=k[i]^0x5c;}
  const inner=_sha256bin(_concat(ipad,enc.encode(msgStr)));
  return Array.from(_sha256bin(_concat(opad,inner))).map(x=>x.toString(16).padStart(2,'0')).join('');
}
/* —— 底层已签名请求（不带自动刷新，供 apiRequest 与 tryRefreshToken 复用）—— */
async function apiRequestRaw(path, opts={}){
  const {method='GET', body=null, auth=true}=opts;
  const url=API_BASE+path;
  const ts=Date.now();
  const nonce=(crypto.randomUUID?crypto.randomUUID():(''+ts+Math.random())).replace(/-/g,'');
  const signBase=method+'\n'+path+'\n'+ts+'\n'+nonce;
  const headers={'Content-Type':'application/json','X-Timestamp':String(ts),'X-Nonce':nonce,'X-Sign':hmacSha256(SIGN_SECRET,signBase),'X-Client':'wordchuang-app/1.0'};
  const token=SecureStore.getItem('access_token'); if(auth&&token)headers['Authorization']='Bearer '+token;
  let res;
  try{ res=await fetch(url,{method,headers,body:body?JSON.stringify(body):undefined}); }
  catch(e){ const err=new Error('网络异常，请检查网络连接'); err.code='NETWORK'; throw err; }
  let data={}; try{data=await res.json();}catch(e){}
  if(!res.ok){ const err=new Error((data&&data.msg)||('请求失败('+res.status+')')); err.code=(data&&data.code)||('HTTP'+res.status); err.status=res.status; throw err; }
  return {res,data};
}
/* —— 双令牌刷新（自身也走签名请求）—— */
async function tryRefreshToken(){
  const rt=SecureStore.getItem('refresh_token'); if(!rt)return false;
  try{
    const {data}=await apiRequestRaw('/api/auth/refresh',{method:'POST',body:{refreshToken:rt},auth:false});
    if(data&&data.success&&data.accessToken){ SecureStore.setItem('access_token',data.accessToken); if(data.refreshToken)SecureStore.setItem('refresh_token',data.refreshToken); return true; }
  }catch(e){}
  SecureStore.removeItem('access_token'); SecureStore.removeItem('refresh_token'); return false;
}
/* —— 统一请求封装（401 自动刷新一次）—— */
async function apiRequest(path, opts={}){
  const {method='GET', body=null, auth=true}=opts;
  const {res,data}=await apiRequestRaw(path,{method,body,auth});
  if(res.status===401&&auth){
    const ok=await tryRefreshToken();
    if(ok)return apiRequest(path,{method,body,auth:true});
    SecureStore.removeItem('access_token'); SecureStore.removeItem('refresh_token');
    const err=new Error('登录已过期，请重新登录'); err.code='UNAUTH'; throw err;
  }
  return data;
}

/* ══ 原生存储适配层：7 个键统一经此映射 ══
   浏览器下回退 localStorage；原生 APP 下由 NativeBridge 接管（WebView/鸿蒙/安卓）。
   键名保持不变：theme/favorites/custom_prompts/usage_stats/viewed_prompts/user_session/community_posts */
window.NativeBridge = window.NativeBridge || (window.__NATIVE__ ? {
  available:true,
  storageGet(k){ try{return window.__NATIVE__.storageGet(k);}catch(e){return null;} },
  storageSet(k,v){ try{return window.__NATIVE__.storageSet(k,String(v));}catch(e){} },
  secureGet(k){ try{return window.__NATIVE__.secureGet(k);}catch(e){return null;} },
  secureSet(k,v){ try{return window.__NATIVE__.secureSet(k,String(v));}catch(e){} }
} : {
  available:false,
  storageGet(k){ return window.localStorage.getItem(k); },
  storageSet(k,v){ return window.localStorage.setItem(k,v); },
  secureGet(k){ return window.localStorage.getItem(k); },
  secureSet(k,v){ return window.localStorage.setItem(k,v); }
});
const LocalStore = {
  getItem(k){
    try{ return NativeBridge.available ? NativeBridge.storageGet(k) : window.localStorage.getItem(k); }
    catch(e){ return null; }
  },
  setItem(k,v){
    try{ if(NativeBridge.available) NativeBridge.storageSet(k,v); else window.localStorage.setItem(k,v); }
    catch(e){ try{ window.localStorage.setItem(k,v); }catch(_){} }
  },
  removeItem(k){
    try{ if(NativeBridge.available) NativeBridge.storageSet(k,null); else window.localStorage.removeItem(k); }
    catch(e){ try{ window.localStorage.removeItem(k); }catch(_){} }
  }
};
const SecureStore = {
  get(k){ try{ return NativeBridge.available ? NativeBridge.secureGet(k) : window.localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ if(NativeBridge.available) NativeBridge.secureSet(k,v); else window.localStorage.setItem(k,v); }catch(e){ try{ window.localStorage.setItem(k,v); }catch(_){} } },
  remove(k){ LocalStore.removeItem(k); }
};

// LocalStore简单封装
const store={get(k,d){try{const v=LocalStore.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){LocalStore.setItem(k,JSON.stringify(v))}};

function initParticles(){
  const canvas=document.getElementById('particles');if(!canvas)return;
  const ctx=canvas.getContext('2d');
  let w,h,nodes=[];
  function resize(){
    w=canvas.width=window.innerWidth*devicePixelRatio;
    h=canvas.height=window.innerHeight*devicePixelRatio;
    canvas.style.width=window.innerWidth+'px';
    canvas.style.height=window.innerHeight+'px';
    const count=isMobile?25:60;
    nodes=Array.from({length:count},()=>({
      x:Math.random()*w,y:Math.random()*h,
      vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,
      r:(Math.random()*1.5+.8)*devicePixelRatio
    }));
  }
  let mouse={x:-9999,y:-9999};
  window.addEventListener('mousemove',throttle(e=>{mouse.x=e.clientX*devicePixelRatio;mouse.y=e.clientY*devicePixelRatio},16),{passive:true});
  window.addEventListener('mouseleave',()=>{mouse.x=mouse.y=-9999});
  function draw(){
    ctx.clearRect(0,0,w,h);
    const linkDist=140*devicePixelRatio;
    for(let i=0;i<nodes.length;i++){
      const a=nodes[i];
      for(let j=i+1;j<nodes.length;j++){
        const b=nodes[j];
        const dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy);
        if(d<linkDist){
          ctx.strokeStyle=`rgba(100,160,255,${.12*(1-d/linkDist)})`;
          ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
        }
      }
      const mdx=a.x-mouse.x,mdy=a.y-mouse.y,md=Math.sqrt(mdx*mdx+mdy*mdy);
      if(md<120*devicePixelRatio){
        ctx.strokeStyle=`rgba(34,211,238,${.2*(1-md/(120*devicePixelRatio))})`;
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(mouse.x,mouse.y);ctx.stroke();
      }
    }
    nodes.forEach(n=>{
      n.x+=n.vx;n.y+=n.vy;
      if(n.x<0||n.x>w)n.vx*=-1;if(n.y<0||n.y>h)n.vy*=-1;
      ctx.fillStyle='rgba(147,197,253,.45)';
      ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);ctx.fill();
    });
    if(!window._rm)requestAnimationFrame(draw);
  }
  window._rm=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  resize();window.addEventListener('resize',debounce(resize,200));
  if(!window._rm)requestAnimationFrame(draw);
}

function countUp(el,target,dur=800){

  function tick(now){const t=Math.min(1,(now-start)/dur);el.textContent=Math.round(target*(1-Math.pow(1-t,3)));if(t<1)requestAnimationFrame(tick);else el.textContent=target}

function buildFullPrompt(p,userNeed){
  const marker='【用户任务需求】';
  const idx=p.content.indexOf(marker);
  if(idx<0)return p.content+'\n\n─────────────────────────────────\n'+marker+'\n'+(userNeed||'');
  const exampleHint='（填写示例：';
  let insertAt=p.content.indexOf('\n\n',idx+marker.length);
  if(insertAt<0)insertAt=idx+marker.length;
  const before=p.content.slice(0,insertAt);
  const afterIdx=p.content.indexOf(exampleHint,idx);
  const after=afterIdx>0?p.content.slice(afterIdx):'';
  return before+'\n\n'+(userNeed||'')+(after?'\n\n'+after:'');
}

async function copyPrompt(id){
  const p=await API.prompts.get(id);const need=_userNeedCache[id]||'';const full=buildFullPrompt(p,need);
  const ok=await copyText(full);
  if(ok){toast('✅ 已复制！点击上方AI按钮即可粘贴','success');recordStat('copy')}
  else toast('复制失败，请手动选中文本Ctrl+C','error');
}
function updatePreview(id){
  const ta=$('#userNeedInput');if(!ta)return;
  const val=ta.value;_userNeedCache[id]=val;
  API.prompts.get(id).then(p=>{
    const full=buildFullPrompt(p,val);
    const box=$('#previewBox');if(box)box.innerHTML='<code>'+esc(full)+'</code>';
    const cc=$('#charCount');if(cc)cc.textContent=full.length;
    const wc=$('#wordCount');if(wc){wc.textContent=val.length;wc.classList.toggle('warn-orange',val.length>1800)}
    ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,400)+'px';
  });
}

async function exportPromptMD(id){
  const p=await API.prompts.get(id);if(!p)return;
  const need=_userNeedCache[id]||'';
  const full=buildFullPrompt(p,need);
  const filename=`${p.title}_${TODAY}.md`;
  downloadFile(filename, full);
  toast('已导出为Markdown文件','success');
}

function deleteCustomPrompt(id){
  if(!confirm('确定要删除这个自定义提示词吗？'))return;
  let list=loadCustomPrompts();
  const realId=String(id).replace('custom_','');
  list=list.filter(p=>String(p.id)!==realId);
  saveCustomPrompts(list);
  toast('已删除','info');
  location.hash='#/custom';
}

function saveCustomPrompt(editId){
  const title=$('#cp_title').value.trim();
  const icon=$('#cp_icon').value.trim()||'💡';
  const desc=$('#cp_desc').value.trim();
  const tagsStr=$('#cp_tags').value.trim();
  const role=$('#cp_role').value.trim();
  const category=$('#cp_category').value;
  if(!title)return toast('请输入标题','warn');
  if(!desc)return toast('请输入描述','warn');
  if(!role)return toast('请输入角色定位','warn');
  const tags=tagsStr.split(/[,，]/).map(t=>t.trim()).filter(Boolean);

  const list=loadCustomPrompts();
  const content=generatePromptTemplate(title,role,desc);

  if(editId){
    const idx=list.findIndex(p=>String(p.id)===String(editId));
    if(idx>=0){list[idx]={...list[idx],title,icon,desc,tags,role,category,content}}
  }else{
    list.unshift({id:Date.now(),title,icon,desc,tags,role,category,content,isCustom:true});
  }
  saveCustomPrompts(list);
  recordStat('custom');
  toast(editId?'已保存修改':'创建成功！','success');
  location.hash='#/custom';
}

function exportAllData(){
  const data={
    favorites:getFavs(),
    custom:loadCustomPrompts(),
    stats:getStats(),
    community:store.get(API.community._postsKey,[]),
    exportTime:new Date().toISOString(),
    version:BRAND.version

function importDataClick(){$('#importFile').click()}
function importAllData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(data.favorites)LocalStore.setItem('favorites',JSON.stringify(data.favorites));
      if(data.custom)LocalStore.setItem('custom_prompts',JSON.stringify(data.custom));
      if(data.stats)LocalStore.setItem('usage_stats',JSON.stringify(data.stats));
      if(data.community)LocalStore.setItem(API.community._postsKey,JSON.stringify(data.community));
      toast('数据导入成功！','success');
      route();
    }catch{toast('导入失败：文件格式错误','error')}
  };
  reader.readAsText(file);
}
function clearAllData(){
  if(!confirm('确定要清除所有数据吗？包括收藏、自定义提示词、社区帖子、使用统计。此操作不可恢复！'))return;
  LocalStore.removeItem('favorites');
  LocalStore.removeItem('custom_prompts');
  LocalStore.removeItem('usage_stats');
  LocalStore.removeItem(API.community._postsKey);
  LocalStore.removeItem('viewed_prompts');
  toast('已清除所有数据','info');
  route();
}
async function syncNow(){
  const u=API.auth.getCurrentUser();
  if(!u){toast('请先登录后再同步云端','warn');return;}
  try{
    await API.sync.upload();
    await API.sync.download();
    toast('云端同步完成 ✅','success');
    route();
  }catch(e){ toast(e.message||'同步失败，请检查网络','error'); }
}

function timeAgo(ts){
  const diff=Date.now()-ts;
  const m=Math.floor(diff/60000),h=Math.floor(m/60),d=Math.floor(h/24);
  if(m<1)return'刚刚';if(m<60)return m+'分钟前';if(h<24)return h+'小时前';return d+'天前';
}

/* ─── 路由 ─── */
let _currentView='';
function route(){
  const hash=location.hash.slice(1)||'/';
  const [path,queryStr]=hash.split('?');
  const params={};
  if(queryStr)queryStr.split('&').forEach(kv=>{const[k,v]=kv.split('=');params[k]=decodeURIComponent(v||'')});

  let view='home',viewKw='',viewId='';

  // FAB显示控制
  const fab=$('#fabNew');
  if(fab)fab.classList.add('hidden');

  if(path==='/'||path===''){
    view='home';viewKw=params.q||'';
    document.title='词创AI · 人人都是AI创造者';
  }else if(path==='/categories'){view='categories';document.title='全部分类 · 词创AI'}
  else if(path.startsWith('/category/')){view='category';viewId=path.split('/')[2];document.title=catById(viewId)?.name+' · 词创AI'}
  else if(path.startsWith('/prompt/')){view='prompt';viewId=path.split('/')[2];document.title='提示词详情 · 词创AI'}
  else if(path==='/tutorial'){view='tutorial';document.title='使用教程 · 词创AI'}
  else if(path==='/about'){view='about';document.title='关于 · 词创AI'}
  else if(path==='/favorites'){view='favorites';document.title='我的收藏 · 词创AI'}
  else if(path==='/custom'){view='custom';document.title='我的提示词 · 词创AI'}
  else if(path==='/custom/create'){view='createCustom';document.title='创建提示词 · 词创AI'}
  else if(path.startsWith('/custom/edit/')){view='createCustom';viewId=path.split('/')[3];document.title='编辑提示词 · 词创AI'}
  else if(path==='/stats'){view='stats';document.title='使用统计 · 词创AI'}
  else if(path==='/community'){view='community';if(fab)fab.classList.remove('hidden');document.title='社区 · 词创AI'}
  else view='404';

  // PC导航高亮
  $$('.nav-link').forEach(a=>{a.classList.toggle('text-neon-cyan',a.getAttribute('href')==='#'+path)});
  // Tab高亮
  $$('.tab-item').forEach(a=>{a.classList.toggle('active',a.getAttribute('href')==='#'+path || (path.startsWith('/prompt') && a.getAttribute('href')==='#/'))});

  const app=$('#app');
  (async()=>{ try{
    let html='';
    switch(view){
      case'home':html=viewHome(viewKw);break;
      case'categories':html=viewCategories();break;
      case'category':html=viewCategory(viewId);break;
      case'prompt':html=await viewPrompt(viewId);break;
      case'tutorial':html=viewTutorial();break;
      case'about':html=viewAbout();break;
      case'favorites':html=viewFavorites();break;
      case'custom':html=viewCustom();break;
      case'createCustom':html=viewCreateCustom(viewId);break;
      case'stats':html=viewStats();break;
      case'community':html=await viewCommunity(params);break;
      default:html=view404();
    }
    app.innerHTML=html;
    window.scrollTo(0,0);

    // 绑定事件
    if(view==='prompt'){
      const ta=$('#userNeedInput');
      if(ta){
        ta.addEventListener('input',()=>updatePreview(viewId));
        updatePreview(viewId);
      }
      $$('.quick-ex-btn').forEach(b=>b.addEventListener('click',()=>{
        ta.value=b.dataset.ex;updatePreview(viewId);
      }));
    }
    if(view==='home'){
      requestAnimationFrame(()=>{$$('.count-num').forEach(el=>{const t=Number(el.dataset.target);if(t)countUp(el,t)})});
      const lm=$('#loadMoreBtn');const grid=$('#allGrid');
      if(lm&&grid){let loaded=20;const all=[...PROMPTS,...loadCustomPrompts()];
        lm.onclick=()=>{const add=all.slice(loaded,loaded+20);loaded+=add.length;grid.insertAdjacentHTML('beforeend',add.map(cardPrompt).join(''));if(loaded>=all.length)lm.remove();};
      }
    }
    _currentView=view;

    // 涟漪效果
    $$('.ripple').forEach(btn=>{
      btn.addEventListener('click',function(e){
        const r=this.getBoundingClientRect();
        const s=document.createElement('span');s.className='rp';
        const sz=Math.max(r.width,r.height);
        s.style.width=s.style.height=sz+'px';
        s.style.left=(e.clientX-r.left-sz/2)+'px';s.style.top=(e.clientY-r.top-sz/2)+'px';
        this.appendChild(s);setTimeout(()=>s.remove(),700);
      },{passive:true});
    });
  }catch(e){
    console.error('[route] 视图渲染失败，已保留当前内容：',e);
    try{ toast('页面渲染出错，已保留当前内容','error'); }catch(_){}
  })();
}

let _isNavigating=false;
function navigate(hash,opts={}){
  if(!hash)return;if(!hash.startsWith('#'))hash='#'+hash;
  if(location.hash===hash && !opts.force)return;
  _isNavigating=true;
  const si=$('#searchInput');if(si && !hash.startsWith('#/?q='))si.value='';
  location.hash=hash;route();_isNavigating=false;
}

function render(){route()}

/* ─── 初始化 ─── */
let _searchTimer;
document.addEventListener('DOMContentLoaded',()=>{
  initTheme();
  initParticles();
  renderDrawerNav();
  renderUserArea();

  // 搜索框
  const si=$('#searchInput');
  if(si)si.addEventListener('input',debounce(e=>{
    const v=e.target.value.trim();
    if(!v){route();return}
    if(!location.hash.startsWith('#/?q='))location.hash='#/?q='+encodeURIComponent(v);
    route();
  },250));
  const sm=$('#searchInputM');
  if(sm)sm.addEventListener('input',debounce(e=>{
    const v=e.target.value.trim();
    if(!v){route();return}
    location.hash='#/?q='+encodeURIComponent(v);
    route();
  },250));

  window.addEventListener('hashchange',()=>{if(!_isNavigating)route()});
  document.addEventListener('click',e=>{if(e.target.closest('.drawer a'))toggleDrawer(false)});
  $('#loginModal').addEventListener('click',e=>{if(e.target===$('#loginModal'))closeLogin()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeLogin();hideUserMenu();toggleDrawer(false)}});
  route();

  document.addEventListener('click', e=>{
    const a=e.target.closest('a[href^="#/"]');if(!a)return;
    const href=a.getAttribute('href');if(!href||!href.startsWith('#/'))return;
    if(e.defaultPrevented)return;
    e.preventDefault();e.stopPropagation();
    toggleDrawer(false);navigate(href);
  },true);
});
</script>
</body>
</html>
