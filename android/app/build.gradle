plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cichuang.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.cichuang.ai"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 注意：release 包必须配置签名（见 README）
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// v1.0 仅依赖 AndroidX 基础库（纯 Java，无 Kotlin/native 传递依赖），
// 规避 kotlin-stdlib 重复类与 security-crypto/tink 原生库解析问题，保证可复现构建。
// 生产环境如需加密存储令牌，在此添加 androidx.security:security-crypto 并同步改 AppBridge。
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
