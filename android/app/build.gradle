plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cichuang.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.cichuang.ai"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 注意：release 包必须配置签名（见 README）
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 解决 checkDebugDuplicateClasses：AndroidX 传递依赖（lifecycle/savedstate 等）
// 会拉入独立的 kotlin-stdlib-jdk7/jdk8，与主 kotlin-stdlib 含重复类，
// 全局排除这两个旧包即可（主 kotlin-stdlib 已内置 jdk7/jdk8 类）。
configurations.all {
    resolutionStrategy {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

// v1.0 仅依赖 AndroidX 基础库（appcompat/webkit 为纯 Java），
// 不引入 security-crypto/tink 原生库（CI 解析链路易导致其类缺失）。
// 生产环境如需加密存储令牌，在此添加 androidx.security:security-crypto 并同步改 AppBridge。
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
