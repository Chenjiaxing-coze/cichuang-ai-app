plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cichuang.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.cichuang.ai"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 注意：release 包必须配置签名（见 README）
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 统一 Kotlin stdlib 版本：现代 kotlin-stdlib 已内置 jdk7/jdk8 类，
// 但部分传递依赖会拉入老旧的 kotlin-stdlib-jdk7/jdk8（1.6.21），
// 导致 checkDebugDuplicateClasses 报"重复类"。在此排除旧包并锁定到 1.8.x。
configurations.all {
    resolutionStrategy {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    // EncryptedSharedPreferences：使用稳定版 1.0.0（1.1.0-alpha06 为预览版，不建议生产）
    implementation 'androidx.security:security-crypto:1.0.0'
    // 显式锁定 Kotlin stdlib 版本（消除 jdk7/jdk8 旧包带来的重复类）
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
}
